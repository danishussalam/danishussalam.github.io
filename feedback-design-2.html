<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Design 2 – Danish Us-Salam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'du-dark': '#16213e',
            'du-blue': '#097fe8',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; margin: 0; -webkit-font-smoothing: antialiased; }
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="bg-white text-gray-900">

  <!-- Navigation -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur border-b border-gray-200" style="height:64px;">
    <div class="max-w-[1200px] mx-auto px-6 h-full flex items-center justify-between">
      <div class="flex items-center gap-10">
        <span class="font-bold text-[16px] text-gray-900 tracking-tight">Danish Us-Salam</span>
        <div class="hidden md:flex items-center gap-7 text-[13px] text-gray-500 font-medium">
          <a href="index.html" class="hover:text-gray-900 transition-colors">Home</a>
          <a href="publications.html" class="hover:text-gray-900 transition-colors">Publications</a>
          <a href="wip.html" class="hover:text-gray-900 transition-colors">Work in Progress</a>
          <a href="research-tools.html" class="hover:text-gray-900 transition-colors">Research Tools</a>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div class="md:hidden flex items-center gap-4 text-[13px] text-gray-600 font-medium">
          <a href="index.html" class="hover:text-gray-900 transition-colors">Home</a>
          <a href="publications.html" class="hover:text-gray-900 transition-colors">Pub</a>
          <a href="wip.html" class="hover:text-gray-900 transition-colors">WIP</a>
          <a href="research-tools.html" class="hover:text-gray-900 transition-colors">Tools</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- DESIGN 2: Card with Border & Icon -->
  <section class="pt-32 pb-20 bg-white">
    <div class="max-w-[550px] mx-auto px-6">
      <div class="bg-white rounded-3xl p-8 border-2 border-gray-500">
        <div class="flex items-start gap-4 mb-8">
          <svg class="w-8 h-8 text-gray-900 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2h-3l-4 4z" />
          </svg>
          <div>
            <h2 class="text-[28px] font-bold text-gray-900 mb-2">Share Your Thoughts</h2>
            <p class="text-[14px] text-gray-600">Help us create better tools for your research.</p>
          </div>
        </div>

        <form class="space-y-6">
          <div>
            <label class="block text-sm font-bold text-gray-900 mb-2 uppercase tracking-wide">Your Name</label>
            <input
              type="text"
              placeholder="John Doe"
              class="w-full px-5 py-3 border-2 border-gray-500 rounded-xl text-gray-700 focus:outline-none focus:border-gray-900 bg-white font-medium"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-du-blue hover:bg-blue-600 text-white font-bold py-4 rounded-xl transition-colors text-base"
          >
            Send Feedback
          </button>
        </form>
      </div>

      <p class="text-xs text-gray-500 text-center mt-8">Takes 10 seconds. Your input matters.</p>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-[#0b1628] border-t border-white/8 py-8">
    <div class="max-w-[1200px] mx-auto px-6 flex flex-wrap justify-between items-center gap-4">
      <div>
        <p class="text-[13px] font-semibold text-white mb-0.5">Danish Us-Salam</p>
        <p class="text-[11px] text-white/35">Economist · Central Bank of Ireland · Dublin, Ireland</p>
      </div>
      <div class="flex items-center gap-5 text-[12px] text-white/35">
        <a href="mailto:ussalamd@tcd.ie" class="hover:text-white/65 transition-colors">ussalamd@tcd.ie</a>
        <a href="https://www.linkedin.com/in/danishussalam/" target="_blank" class="hover:text-white/65 transition-colors">LinkedIn</a>
        <a href="https://twitter.com/DanishUsSalam2" target="_blank" class="hover:text-white/65 transition-colors">Twitter</a>
      </div>
    </div>
  </footer>

</body>
</html>
